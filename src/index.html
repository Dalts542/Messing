<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paddock Intelligence v2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
:root{
  --bg:#090f0c;--surface:rgba(14,22,18,0.92);--surface-raised:#152019;
  --border:rgba(5,150,105,0.14);--border-bright:rgba(5,150,105,0.35);
  --accent:#059669;--accent-dim:rgba(5,150,105,0.1);
  --gold:#d4a017;--gold-dim:rgba(212,160,23,0.12);
  --green:#10b981;--red:#ef4444;--amber:#f59e0b;
  --text:#e2e8f0;--text-mid:#94a3b8;--text-dim:#475569;
  --font-display:'Playfair Display',Georgia,serif;
  --font-ui:'Inter',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
html{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-ui);height:100%;overflow:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 30% 60%,rgba(5,150,105,0.05),transparent 60%),radial-gradient(ellipse at 70% 20%,rgba(212,160,23,0.03),transparent 50%);pointer-events:none;z-index:0}

/* HEADER */
header{position:relative;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:10px 20px;border-bottom:1px solid var(--border);backdrop-filter:blur(12px);background:rgba(9,15,12,0.88);height:50px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:0.5px;color:var(--text);white-space:nowrap}
.logo span{color:var(--accent)}
.search-box{display:flex;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:5px 12px;gap:6px;max-width:320px;flex:1;margin:0 20px}
.search-box input{background:none;border:none;color:var(--text);font-family:var(--font-ui);font-size:12px;outline:none;width:100%}
.search-box input::placeholder{color:var(--text-dim)}
.header-status{display:flex;gap:12px;align-items:center;font-family:var(--font-mono);font-size:10px;color:var(--text-dim)}
.status-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:4px}
.status-dot.on{background:var(--green);box-shadow:0 0 6px var(--green)}
.status-dot.off{background:var(--red);box-shadow:0 0 6px var(--red)}

/* LAYOUT */
.app{display:grid;grid-template-columns:200px 1fr;height:calc(100vh - 50px);position:relative;z-index:1}
@media(max-width:800px){.app{grid-template-columns:1fr}.sidebar{display:none}}

/* SIDEBAR */
.sidebar{border-right:1px solid var(--border);padding:12px;overflow-y:auto;background:rgba(9,15,12,0.5);display:flex;flex-direction:column;gap:4px}
.nav-label{font-family:var(--font-mono);font-size:9px;letter-spacing:2px;color:var(--text-dim);padding:12px 8px 6px;display:flex;align-items:center;gap:6px}
.nav-label::before{content:'';width:3px;height:10px;background:var(--accent);border-radius:2px}
.nav-btn{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:1px solid transparent;color:var(--text-mid);font-size:12px;padding:7px 10px;border-radius:6px;cursor:pointer;transition:all .15s;font-family:var(--font-ui)}
.nav-btn:hover{background:var(--accent-dim);border-color:var(--border);color:var(--text)}
.nav-btn.active{background:var(--accent-dim);border-color:var(--border-bright);color:var(--accent)}
.nav-icon{width:16px;text-align:center;font-size:13px}

/* MAIN */
.main{overflow-y:auto;padding:20px 24px;scroll-behavior:smooth}

/* CARDS & PANELS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 20px;margin-bottom:14px}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.card-title{font-family:var(--font-display);font-size:16px;font-weight:600}
.card-subtitle{font-family:var(--font-mono);font-size:10px;color:var(--text-dim);letter-spacing:0.5px}
.badge{display:inline-block;font-family:var(--font-mono);font-size:10px;padding:2px 8px;border-radius:4px;letter-spacing:0.5px}
.badge-green{background:rgba(16,185,129,0.12);color:var(--green);border:1px solid rgba(16,185,129,0.25)}
.badge-gold{background:var(--gold-dim);color:var(--gold);border:1px solid rgba(212,160,23,0.25)}
.badge-red{background:rgba(239,68,68,0.1);color:var(--red);border:1px solid rgba(239,68,68,0.2)}
.badge-dim{background:var(--surface-raised);color:var(--text-dim);border:1px solid var(--border)}

/* SUMMARY BAR */
.summary-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px}
.stat-box{background:var(--surface-raised);border:1px solid var(--border);border-radius:8px;padding:12px 14px;text-align:center}
.stat-val{font-family:var(--font-mono);font-size:22px;font-weight:600;color:var(--accent)}
.stat-label{font-family:var(--font-mono);font-size:9px;letter-spacing:1.5px;color:var(--text-dim);margin-top:4px}

/* MEETING GRID */
.meeting-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.meeting-card{background:var(--surface-raised);border:1px solid var(--border);border-radius:10px;padding:14px 16px;cursor:pointer;transition:all .2s}
.meeting-card:hover{border-color:var(--border-bright);transform:translateY(-1px)}
.meeting-name{font-family:var(--font-display);font-size:15px;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.meeting-meta{font-family:var(--font-mono);font-size:11px;color:var(--text-mid);display:flex;gap:12px;flex-wrap:wrap}

/* TABLES */
.table-wrap{overflow-x:auto;border-radius:8px;border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:12px}
thead{background:var(--surface-raised)}
th{font-family:var(--font-mono);font-size:10px;letter-spacing:0.5px;color:var(--text-dim);text-align:left;padding:8px 12px;border-bottom:1px solid var(--border);cursor:pointer;white-space:nowrap;user-select:none}
th:hover{color:var(--accent)}
th.sorted-asc::after{content:' ▲';color:var(--accent)}
th.sorted-desc::after{content:' ▼';color:var(--accent)}
td{padding:8px 12px;border-bottom:1px solid rgba(30,41,59,0.2);white-space:nowrap}
tr:hover{background:var(--accent-dim)}
.nr{opacity:0.4;text-decoration:line-through}

/* FORM SCORE BAR */
.form-bar{width:60px;height:6px;background:rgba(71,85,105,0.3);border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:6px}
.form-fill{height:100%;border-radius:3px}

/* FLAG CHIPS */
.flag{display:inline-block;font-family:var(--font-mono);font-size:9px;padding:1px 5px;border-radius:3px;margin:1px 2px;letter-spacing:0.3px}
.flag-strong{background:rgba(16,185,129,0.15);color:var(--green)}
.flag-poor{background:rgba(239,68,68,0.12);color:var(--red)}
.flag-high{background:var(--gold-dim);color:var(--gold)}
.flag-layoff{background:rgba(245,158,11,0.12);color:var(--amber)}

/* AI CHAT */
.chat-container{display:flex;flex-direction:column;height:calc(100vh - 90px)}
.chat-messages{flex:1;overflow-y:auto;padding:0;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.msg{font-size:13px;line-height:1.7;max-width:85%;border-radius:10px;padding:12px 16px}
.msg.system{background:var(--surface);border:1px solid var(--border);align-self:flex-start;white-space:pre-wrap;word-wrap:break-word}
.msg.user{background:var(--accent-dim);border:1px solid var(--border-bright);align-self:flex-end}
.msg-label{display:block;font-family:var(--font-mono);font-size:9px;letter-spacing:1.5px;color:var(--accent);margin-bottom:4px}
.msg.user .msg-label{color:var(--gold)}
.chat-input-area{display:flex;gap:8px;padding-top:12px;border-top:1px solid var(--border);margin-top:auto}
.chat-input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-family:var(--font-ui);font-size:13px;outline:none;resize:none;min-height:40px;max-height:120px}
.chat-input:focus{border-color:var(--border-bright)}
.chat-send{background:var(--accent);border:none;color:#fff;border-radius:8px;padding:10px 18px;cursor:pointer;font-family:var(--font-mono);font-size:11px;letter-spacing:0.5px;white-space:nowrap}
.chat-send:hover{filter:brightness(1.15)}
.chat-send:disabled{opacity:0.4;cursor:default}

/* TABS */
.tabs{display:flex;gap:2px;margin-bottom:14px;border-bottom:1px solid var(--border);padding-bottom:0}
.tab{font-family:var(--font-mono);font-size:11px;letter-spacing:0.5px;color:var(--text-dim);padding:8px 14px;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* DETAIL VIEW */
.back-btn{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;color:var(--text-dim);cursor:pointer;background:none;border:none;margin-bottom:14px;padding:4px 0;letter-spacing:0.5px}
.back-btn:hover{color:var(--accent)}
.race-header-detail{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.race-title{font-family:var(--font-display);font-size:20px;font-weight:700}
.race-info{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}

/* DATA STATUS */
.source-card{background:var(--surface-raised);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px}
.source-header{display:flex;justify-content:space-between;align-items:center}
.source-name{font-family:var(--font-display);font-size:14px;font-weight:600}
.source-meta{font-family:var(--font-mono);font-size:10px;color:var(--text-dim);margin-top:6px;display:flex;gap:16px;flex-wrap:wrap}

/* SECTION TITLES */
.section-title{font-family:var(--font-display);font-size:20px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.section-title::before{content:'';width:4px;height:22px;background:var(--accent);border-radius:2px}

/* LOADING */
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-msg{text-align:center;padding:40px;color:var(--text-dim);font-family:var(--font-mono);font-size:12px}

/* BUTTONS */
.btn{background:var(--accent-dim);border:1px solid var(--border);color:var(--text-mid);border-radius:6px;padding:6px 14px;cursor:pointer;font-family:var(--font-mono);font-size:11px;letter-spacing:0.5px;transition:all .2s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-accent:hover{filter:brightness(1.15)}

/* SEARCH RESULTS */
.search-results{max-height:70vh}
.search-section{margin-bottom:16px}
.search-section h3{font-family:var(--font-display);font-size:14px;margin-bottom:8px;color:var(--text-mid)}
.search-item{padding:6px 10px;border-radius:6px;cursor:pointer;font-size:12px;display:flex;justify-content:space-between;align-items:center}
.search-item:hover{background:var(--accent-dim)}

/* SCROLLBAR */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--border-bright)}

/* TOOLTIP */
.tip{position:relative}
.tip::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--surface-raised);border:1px solid var(--border);color:var(--text);font-family:var(--font-mono);font-size:10px;padding:4px 8px;border-radius:4px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s;z-index:20}
.tip:hover::after{opacity:1}

/* AI SUMMARY BOX */
.ai-summary{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:14px;font-size:13px;line-height:1.7;white-space:pre-wrap}
.ai-summary-label{font-family:var(--font-mono);font-size:9px;letter-spacing:1.5px;color:var(--accent);margin-bottom:6px;display:flex;align-items:center;gap:6px}
</style>
</head>
<body>

<header>
  <div class="logo">&#127943; PADDOCK <span>INTELLIGENCE</span></div>
  <div class="search-box">
    <span style="color:var(--text-dim)">&#128269;</span>
    <input id="globalSearch" type="text" placeholder="Search horses, trainers, jockeys, courses..." autocomplete="off">
  </div>
  <div class="header-status">
    <span><span class="status-dot" id="aiDot"></span><span id="aiLabel">AI</span></span>
    <span><span class="status-dot" id="dataDot"></span><span id="dataLabel">DATA</span></span>
  </div>
</header>

<div class="app">
  <nav class="sidebar">
    <div class="nav-label">DASHBOARD</div>
    <button class="nav-btn active" data-view="today"><span class="nav-icon">&#9737;</span> Today</button>
    <button class="nav-btn" data-view="meetings"><span class="nav-icon">&#127966;</span> Meetings</button>
    <div class="nav-label">LOOKUP</div>
    <button class="nav-btn" data-view="horses"><span class="nav-icon">&#127943;</span> Horses</button>
    <button class="nav-btn" data-view="trainers"><span class="nav-icon">&#128100;</span> Trainers</button>
    <button class="nav-btn" data-view="jockeys"><span class="nav-icon">&#127939;</span> Jockeys</button>
    <div class="nav-label">TOOLS</div>
    <button class="nav-btn" data-view="ai"><span class="nav-icon">&#129302;</span> AI Assistant</button>
    <button class="nav-btn" data-view="status"><span class="nav-icon">&#9889;</span> Data Status</button>
    <button class="nav-btn" data-view="settings"><span class="nav-icon">&#9881;</span> Settings</button>
    <div style="flex:1"></div>
    <div id="sidebarMeetings" style="border-top:1px solid var(--border);padding-top:12px;margin-top:8px"></div>
  </nav>

  <div class="main" id="mainContent"></div>
</div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
let state = { view: 'today', data: null, aiStatus: null, raceDetail: null, meetingDetail: null, searchQuery: '' };

// NAV
$$('.nav-btn').forEach(b => b.addEventListener('click', () => {
  state.view = b.dataset.view;
  state.raceDetail = null;
  state.meetingDetail = null;
  $$('.nav-btn').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  render();
}));

// SEARCH
let searchTimer;
$('#globalSearch').addEventListener('input', e => {
  clearTimeout(searchTimer);
  const q = e.target.value.trim();
  if (q.length < 2) { if (state.view === 'search') { state.view = 'today'; render(); } return; }
  searchTimer = setTimeout(async () => {
    state.searchQuery = q;
    state.view = 'search';
    $$('.nav-btn').forEach(x => x.classList.remove('active'));
    render();
  }, 300);
});

// API
async function api(path) {
  const r = await fetch(path);
  return r.json();
}

// INITIAL LOAD
async function loadDashboard() {
  try {
    const [today, aiStatus] = await Promise.all([api('/api/today'), api('/api/ai-status')]);
    state.data = today;
    state.aiStatus = aiStatus;
    updateStatusDots();
    updateSidebarMeetings();
    render();
  } catch (e) {
    $('#mainContent').innerHTML = '<div class="loading-msg">Failed to load data. Is the server running?</div>';
  }
}

function updateStatusDots() {
  const ai = state.aiStatus;
  $('#aiDot').className = 'status-dot ' + (ai && ai.online ? 'on' : 'off');
  $('#aiLabel').textContent = ai && ai.online ? ai.model || 'AI' : 'AI OFF';
  const d = state.data;
  const hasData = d && d.total_meetings > 0;
  $('#dataDot').className = 'status-dot ' + (hasData ? 'on' : 'off');
  $('#dataLabel').textContent = hasData ? d.total_races + ' RACES' : 'NO DATA';
}

function updateSidebarMeetings() {
  const el = $('#sidebarMeetings');
  if (!state.data || !state.data.meetings) { el.innerHTML = ''; return; }
  el.innerHTML = '<div class="nav-label">MEETINGS</div>' +
    state.data.meetings.map(m =>
      `<button class="nav-btn" onclick="showMeeting('${esc(m.id)}')" style="font-size:11px">
        <span class="nav-icon">${m.country === 'IRE' ? '&#9752;' : '&#127468;&#127463;'}</span>
        ${esc(m.course)} <span style="color:var(--text-dim);font-family:var(--font-mono);font-size:10px;margin-left:auto">${m.race_count || '?'}</span>
      </button>`
    ).join('');
}

// RENDER
function render() {
  const el = $('#mainContent');
  switch (state.view) {
    case 'today': return renderToday(el);
    case 'meetings': return renderMeetings(el);
    case 'horses': return renderLookup(el, 'horses');
    case 'trainers': return renderLookup(el, 'trainers');
    case 'jockeys': return renderLookup(el, 'jockeys');
    case 'ai': return renderAI(el);
    case 'status': return renderStatus(el);
    case 'settings': return renderSettings(el);
    case 'search': return renderSearch(el);
    case 'race': return renderRaceDetail(el);
    case 'meeting': return renderMeetingDetail(el);
    default: renderToday(el);
  }
}

// TODAY
function renderToday(el) {
  const d = state.data;
  if (!d) { el.innerHTML = '<div class="loading-msg"><span class="spinner"></span> Loading dashboard...</div>'; return; }
  el.innerHTML = `
    <div class="section-title">Today's Racing</div>
    <div class="summary-bar">
      <div class="stat-box"><div class="stat-val">${d.total_meetings}</div><div class="stat-label">MEETINGS</div></div>
      <div class="stat-box"><div class="stat-val">${d.total_races}</div><div class="stat-label">RACES</div></div>
      <div class="stat-box"><div class="stat-val">${d.total_runners}</div><div class="stat-label">RUNNERS</div></div>
      <div class="stat-box"><div class="stat-val">${d.non_runners}</div><div class="stat-label">NON-RUNNERS</div></div>
      <div class="stat-box"><div class="stat-val">${d.gb_meetings}</div><div class="stat-label">GB</div></div>
      <div class="stat-box"><div class="stat-val">${d.ire_meetings}</div><div class="stat-label">IRE</div></div>
    </div>
    ${d.refresh ? `<div style="font-family:var(--font-mono);font-size:10px;color:var(--text-dim);margin-bottom:14px">
      Last refresh: ${d.refresh.last_refresh ? new Date(d.refresh.last_refresh).toLocaleTimeString() : 'Never'}
      ${d.refresh.refreshing ? ' <span class="badge badge-gold">REFRESHING</span>' : ''}
      <button class="btn" onclick="refreshData()" style="margin-left:8px">Refresh Now</button>
    </div>` : ''}
    <div class="meeting-grid">
      ${(d.meetings || []).map(m => `
        <div class="meeting-card" onclick="showMeeting('${esc(m.id)}')">
          <div class="meeting-name">
            ${m.country === 'IRE' ? '&#9752;' : '&#127468;&#127463;'} ${esc(m.course)}
            <span class="badge ${m.country === 'IRE' ? 'badge-green' : 'badge-dim'}">${esc(m.country)}</span>
          </div>
          <div class="meeting-meta">
            <span>${m.race_count || '?'} races</span>
            <span>${m.total_runners || '?'} runners</span>
            ${m.going ? `<span>Going: ${esc(m.going)}</span>` : ''}
            ${m.first_race ? `<span>${esc(m.first_race)} - ${esc(m.last_race || '?')}</span>` : ''}
          </div>
        </div>
      `).join('')}
    </div>
    ${d.total_meetings === 0 ? '<div class="loading-msg">No meetings found for today. Click "Refresh Now" to fetch data, or check Data Status.</div>' : ''}
    ${d.ai ? `<div class="card" style="margin-top:18px">
      <div class="card-header"><div class="card-title">AI Status</div>
        <span class="badge ${d.ai.online ? 'badge-green' : 'badge-red'}">${d.ai.online ? 'ONLINE' : 'OFFLINE'}</span>
      </div>
      <div style="font-family:var(--font-mono);font-size:11px;color:var(--text-mid)">
        ${d.ai.online ? 'Model: ' + esc(d.ai.model || '?') + ' &mdash; Cost: ' + esc(d.ai.cost || '£0') : 'Install Ollama from <a href="https://ollama.com" style="color:var(--accent)">ollama.com</a> then run: ollama pull llama3.1:8b'}
      </div>
    </div>` : ''}
  `;
}

// MEETINGS
function renderMeetings(el) {
  const d = state.data;
  if (!d) { el.innerHTML = '<div class="loading-msg"><span class="spinner"></span></div>'; return; }
  el.innerHTML = `
    <div class="section-title">All Meetings</div>
    ${(d.meetings || []).map(m => `
      <div class="meeting-card" onclick="showMeeting('${esc(m.id)}')" style="margin-bottom:10px">
        <div class="meeting-name">${m.country === 'IRE' ? '&#9752;' : '&#127468;&#127463;'} ${esc(m.course)}
          <span class="badge ${m.country === 'IRE' ? 'badge-green' : 'badge-dim'}">${esc(m.country)}</span></div>
        <div class="meeting-meta">
          <span>${m.race_count || '?'} races</span>
          <span>${m.total_runners || '?'} runners</span>
          ${m.going ? `<span>Going: ${esc(m.going)}</span>` : ''}
          ${m.first_race ? `<span>${esc(m.first_race)} - ${esc(m.last_race || '?')}</span>` : ''}
        </div>
      </div>
    `).join('')}
    ${d.total_meetings === 0 ? '<div class="loading-msg">No meetings today.</div>' : ''}
  `;
}

// MEETING DETAIL
async function showMeeting(id) {
  state.meetingDetail = id;

let sortKey = null, sortDir = 1;
function sortRunners(key) {
  if (!state._raceData || !state._raceData.runners) return;
  if (sortKey === key) sortDir *= -1; else { sortKey = key; sortDir = -1; }
  state._raceData.runners.sort((a, b) => {
    let va = a[key], vb = b[key];
    if (va == null) va = key === 'horse' ? 'zzz' : -999;
    if (vb == null) vb = key === 'horse' ? 'zzz' : -999;
    if (typeof va === 'string') return va.localeCompare(vb) * sortDir;
    return ((va || 0) - (vb || 0)) * sortDir;
  });
  render();
}

// AI CHAT
let chatMessages = [];
let chatStreaming = false;

function renderAI(el) {
  el.innerHTML = `
    <div class="section-title">AI Assistant</div>
    <div class="chat-container">
      <div class="chat-messages" id="chatMsgs">
        ${chatMessages.length === 0 ? `
          <div class="msg system">
            <span class="msg-label">PADDOCK INTELLIGENCE AI</span>
            ${state.aiStatus && state.aiStatus.online
              ? 'Local AI is ready. Ask me about today\'s racing — meetings, runners, form analysis, trainer stats, or anything in the database.\n\nModel: ' + esc(state.aiStatus.model || '?') + ' | Cost: £0 per query'
              : 'Local AI is offline.\n\nInstall Ollama (free) from https://ollama.com\nThen run: ollama pull llama3.1:8b\nRestart the server afterwards.'}
          </div>
        ` : chatMessages.map(m => `
          <div class="msg ${m.role === 'user' ? 'user' : 'system'}">
            <span class="msg-label">${m.role === 'user' ? 'YOU' : 'AI'}</span>
            ${esc(m.content)}
          </div>
        `).join('')}
      </div>
      <div class="chat-input-area">
        <textarea class="chat-input" id="chatInput" placeholder="Ask about today's racing..." rows="1"
          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat()}"></textarea>
        <button class="chat-send" id="chatSendBtn" onclick="sendChat()">SEND</button>
      </div>
    </div>
  `;
  const msgs = $('#chatMsgs');
  if (msgs) msgs.scrollTop = msgs.scrollHeight;
}

async function sendChat() {
  const input = $('#chatInput');
  if (!input) return;
  const text = input.value.trim();
  if (!text || chatStreaming) return;

  chatMessages.push({ role: 'user', content: text });
  input.value = '';
  renderAI($('#mainContent'));

  chatStreaming = true;
  const sendBtn = $('#chatSendBtn');
  if (sendBtn) sendBtn.disabled = true;

  let aiContent = '';
  chatMessages.push({ role: 'assistant', content: '' });

  try {
    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: chatMessages.slice(0, -1).map(m => ({ role: m.role, content: m.content })) })
    });

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const payload = line.slice(6);
        if (payload === '[DONE]') continue;
        try {
          const d = JSON.parse(payload);
          if (d.type === 'text' && d.content) {
            aiContent += d.content;
            chatMessages[chatMessages.length - 1].content = aiContent;
            const msgEl = document.querySelectorAll('#chatMsgs .msg.system');
            const last = msgEl[msgEl.length - 1];
            if (last) {
              last.innerHTML = '<span class="msg-label">AI</span>' + esc(aiContent);
              const msgs = $('#chatMsgs');
              msgs.scrollTop = msgs.scrollHeight;
            }
          }
        } catch {}
      }
    }
  } catch (e) {
    chatMessages[chatMessages.length - 1].content = 'Error: ' + e.message;
  }

  chatStreaming = false;
  renderAI($('#mainContent'));
}

            <span>${esc(c.course)}</span><span style="font-family:var(--font-mono);font-size:10px;color:var(--text-dim)">${c.cnt} races</span>
          </div>`).join('')}</div>` : ''}
        ${(!data.horses?.length && !data.trainers?.length && !data.jockeys?.length && !data.courses?.length) ?
          '<div class="loading-msg">No results found.</div>' : ''}
      </div>
    `;
  } catch { el.innerHTML = '<div class="section-title">Search</div><div class="loading-msg">Search failed.</div>'; }
}

// HELPERS
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formBar(score) {
  const color = score >= 70 ? 'var(--green)' : score >= 40 ? 'var(--amber)' : 'var(--red)';
  return ` <div class="form-bar"><div class="form-fill" style="width:${score}%;background:${color}"></div></div>`;
}

function flagChip(f) {
  const map = {
    'STRONG_FORM': ['flag-strong', 'STRONG'],
    'POOR_FORM': ['flag-poor', 'POOR'],
    'HIGH_RATED': ['flag-high', 'HIGH OR'],
    'LONG_LAYOFF': ['flag-layoff', 'LAYOFF'],
    'QUICK_RETURN': ['flag-strong', 'QUICK'],
    'NON_RUNNER': ['flag-poor', 'NR']
  };
  const [cls, label] = map[f] || ['', f];
  return `<span class="flag ${cls}">${label}</span>`;
}

async function refreshData() {
  try {
    await fetch('/api/refresh', { method: 'POST' });
    await loadDashboard();
  } catch {}
}

// AUTO-REFRESH
setInterval(loadDashboard, 60000);

// INIT
loadDashboard();
</script>
</body>
</html>
